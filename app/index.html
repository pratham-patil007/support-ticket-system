<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Support Ticket Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="sidebar">

    <h2>SupportDesk</h2>

    <ul>
        <li onclick="showSection('dashboard')">Dashboard</li>
        <li onclick="showSection('register')">Register</li>
        <li onclick="showSection('login')">Login</li>
        <li onclick="showSection('tickets')">Tickets</li>
    </ul>

</div>

<div class="content">

    <!-- DASHBOARD -->

    <div id="dashboard" class="section active">

        <h1 class="mb-4">Dashboard</h1>

        <div class="row g-4">

            <div class="col-md-4">
                <div class="card stat-card">
                    <h1 id="totalTickets">0</h1>
                    <p>Total Tickets</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card stat-card">
                    <h1 id="openTickets">0</h1>
                    <p>Open Tickets</p>
                </div>
            </div>

            <div class="col-md-4">
                <div class="card stat-card">
                    <h1 id="closedTickets">0</h1>
                    <p>Closed Tickets</p>
                </div>
            </div>

        </div>

    </div>

    <!-- REGISTER -->

    <div id="register" class="section">

        <div class="card p-4">

            <h2>Register User</h2>

            <input id="rname" class="form-control mb-3" placeholder="Name">

            <input id="remail" class="form-control mb-3" placeholder="Email">

            <input id="rpassword" type="password" class="form-control mb-3" placeholder="Password">

            <button onclick="registerUser()" class="btn btn-success">
                Register
            </button>

        </div>

    </div>

    <!-- LOGIN -->

    <div id="login" class="section">

        <div class="card p-4">

            <h2>Login</h2>

            <input id="lemail" class="form-control mb-3" placeholder="Email">

            <input id="lpassword" type="password" class="form-control mb-3" placeholder="Password">

            <button onclick="loginUser()" class="btn btn-primary">
                Login
            </button>

        </div>

    </div>

    <!-- TICKETS -->

    <div id="tickets" class="section">

        <div class="card p-4 mb-4">

            <h2>Create Ticket</h2>

            <input id="title" class="form-control mb-3" placeholder="Ticket Title">

            <textarea id="description" class="form-control mb-3" placeholder="Description"></textarea>

            <select id="priority" class="form-select mb-3">

                <option>Low</option>
                <option>Medium</option>
                <option>High</option>

            </select>

            <button onclick="createTicket()" class="btn btn-primary">
                Create Ticket
            </button>

        </div>

        <div class="card p-4">

            <h2>All Tickets</h2>

            <table class="table">

                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Priority</th>
                        <th>Actions</th>
                    </tr>
                </thead>

                <tbody id="ticketTable"></tbody>

            </table>

        </div>

    </div>

</div>

<script src="app.js"></script>

</body>
</html>
